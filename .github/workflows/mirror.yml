name: Mirror to Codeberg

on:
 push:
   branches: ['**']
   tags: ['**']
 delete:

permissions:
 contents: read

jobs:
 mirror:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout (tout l'historique, toutes les branches)
       uses: actions/checkout@v4
       with:
         fetch-depth: 0

     - name: Push vers Codeberg (branches et étiquettes)
       run: |
         git remote add codeberg https://MESHED-SAS:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/MESHED-SAS/meshed-mirror-test.git
         git remote set-head origin -d || true
         git push --prune codeberg '+refs/remotes/origin/*:refs/heads/*' '+refs/tags/*:refs/tags/*'