name: Mirror to Codeberg

on:
  push:
    branches: ['**']
    tags: ['**']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (avec tout l'historique)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror vers Codeberg
        run: |
          git remote add codeberg https://MESHED-SAS:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/MESHED-SAS/meshed-mirror-test.git
          git push --mirror codeberg

